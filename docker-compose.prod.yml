services:
  typst:
    build:
      context: ./typst-service
    restart: unless-stopped
    networks:
      - dokploy-network

  embed:
    build:
      context: ./embed-service
    restart: unless-stopped
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

volumes:
  redis_prod_data:
    name: scholio_redis_prod

networks:
  dokploy-network:
    external: true
