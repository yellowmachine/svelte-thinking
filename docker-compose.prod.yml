services:
  backup:
    build:
      context: .
      dockerfile: backup-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      R2_BUCKET: ${R2_BUCKET:-scholio-backups}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_logs:/logs
    networks:
      - scholio-network


  typst:
    build:
      context: ./typst-service
    restart: unless-stopped
    networks:
      - scholio-network

  embed:
    build:
      context: ./embed-service
    restart: unless-stopped
    networks:
      - scholio-network

  scipy:
    build:
      context: ./scipy-service
    restart: unless-stopped
    environment:
      SCIPY_API_KEY: ${SCIPY_API_KEY}
    networks:
      - scholio-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholio-network

volumes:
  redis_prod_data:
    name: scholio_redis_prod
  backup_logs:
    name: scholio_backup_logs

networks:
  scholio-network:
    name: scholio-network
