# Despliegue de Scholio desde cero: un solo stack de Dokploy con su propia base
# de datos, sin redes externas aparte de dokploy-network (la de Traefik).
services:
  scholio:
    image: ghcr.io/yellowmachine/svelte-thinking:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 20M
      # App
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Su propia base de datos (servicio db): la app como scholio_app (RLS), las
      # migraciones como el dueño. migrate.mjs crea scholio_app si no existe.
      DATABASE_URL: postgres://scholio_app:${APP_DB_PASSWORD}@db:5432/scholio
      MIGRATION_DATABASE_URL: postgres://scholio:${POSTGRES_PASSWORD}@db:5432/scholio
      APP_DB_USER: scholio_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Servicios internos del stack
      REDIS_URL: redis://redis:6379
      TYPST_SERVICE_URL: http://typst:3100
      KROKI_URL: http://kroki:8000
      # Storage (rustfs, en este mismo stack)
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-scholio}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      # «Entrar con Seilide» (opcional): las tres líneas del cliente de /admin/apps
      SEILIDE_URL: ${SEILIDE_URL:-}
      SEILIDE_CLIENT_ID: ${SEILIDE_CLIENT_ID:-}
      SEILIDE_CLIENT_SECRET: ${SEILIDE_CLIENT_SECRET:-}
      # ORCID
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI:-}
      ORCID_BASE_URL: ${ORCID_BASE_URL:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Cifra las API keys de los usuarios (BYOK): cambiarla las pierde
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      # AI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
    # Sin puerto al host: Traefik llega por dokploy-network al 3000.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - dokploy-network

  # Postgres de Scholio, solo en la red interna del stack. Arranca vacío:
  # migrate.mjs (al arrancar la app) crea la extensión, el schema, el rol de la
  # app y las tablas. Sin init.sh.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scholio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scholio -d scholio']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  typst:
    image: ghcr.io/yellowmachine/scholio-typst:latest
    pull_policy: always
    restart: unless-stopped

  kroki:
    image: yuzutech/kroki:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - KROKI_MERMAID_HOST=kroki-mermaid

  # Mermaid needs a headless-browser companion — not bundled in the main
  # kroki image, which only handles diagram types renderable in-JVM.
  kroki-mermaid:
    image: yuzutech/kroki-mermaid:latest
    pull_policy: always
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data # single physical disk, no erasure coding
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info
    # Sin puertos al host: el dominio de STORAGE_PUBLIC_URL llega por Traefik
    # (dokploy-network, puerto 9000); la consola (9001) igual, si le das dominio.
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default
      - dokploy-network

# Sin `name:`: Compose les antepone el nombre del proyecto de Dokploy, así que
# no chocan con los volúmenes scholio_* del despliegue anterior.
volumes:
  pgdata:
  redis_data:
  rustfs_data:
  rustfs_logs:

networks:
  dokploy-network:
    external: true
