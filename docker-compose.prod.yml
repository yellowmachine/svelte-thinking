services:
  typst:
    build:
      context: ./typst-service
    restart: unless-stopped
    networks:
      - scholio-network

  embed:
    build:
      context: ./embed-service
    restart: unless-stopped
    networks:
      - scholio-network

  scipy:
    build:
      context: ./scipy-service
    restart: unless-stopped
    environment:
      SCIPY_API_KEY: ${SCIPY_API_KEY}
    networks:
      - scholio-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholio-network

volumes:
  redis_prod_data:
    name: scholio_redis_prod

networks:
  scholio-network:
    name: scholio-network
