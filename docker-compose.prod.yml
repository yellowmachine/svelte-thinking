services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    #ports:
    #  - "5432:5432"
    networks:
      - scholio-network

  scholio:
    image: ghcr.io/yellowmachine/svelte-thinking:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 20M
      # App
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Database (external, accessed by hostname)
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DB_USER: scholio_app
      # Internal services (scholio-network)
      REDIS_URL: ${REDIS_URL}
      EMBED_SERVICE_URL: ${EMBED_SERVICE_URL}
      TYPST_SERVICE_URL: ${TYPST_SERVICE_URL}
      # External services
      SCIPY_SERVICE_URL: ${SCIPY_SERVICE_URL}
      # Storage (S3-compatible, external)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      # Auth providers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI}
      ORCID_BASE_URL: ${ORCID_BASE_URL}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Encryption
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      # Cross-app auth (shared cookie across subdomains)
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    #ports:
    #- "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 0s
    networks:
      - scholio-network

  librarian:
    image: ghcr.io/yellowmachine/librarian-bun-kilo:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      scholio:
        condition: service_healthy
    #ports:
    #- "3001:3000"
    environment:
      NODE_ENV: production
      ORIGIN: ${LIBRARIAN_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    networks:
      - scholio-network

  backup:
    image: ghcr.io/yellowmachine/scholio-backup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      R2_BUCKET: ${R2_BUCKET:-scholio-backups}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_logs:/logs
    networks:
      - scholio-network

  typst:
    image: ghcr.io/yellowmachine/scholio-typst:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - scholio-network

  embed:
    image: ghcr.io/yellowmachine/scholio-embed:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - scholio-network

  scipy:
    image: ghcr.io/yellowmachine/scholio-scipy:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - scholio-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholio-network

  rustfs:
    security_opt:
      - "no-new-privileges:true"
    image: rustfs/rustfs:latest
    ports:
      #- "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=info
      #- RUSTFS_TLS_PATH=/opt/tls
      #- RUSTFS_OBS_ENDPOINT=http://otel-collector:4318
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/app/logs
      #- ./deploy/data/certs/:/opt/tls # TLS configuration, you should create tls directory and put your tls files in it and then specify the path here
    networks:
      - scholio-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_prod_data:
    name: scholio_postgres_prod
  redis_prod_data:
    name: scholio_redis_prod
  backup_logs:
    name: scholio_backup_logs
  rustfs-data:
  rustfs-logs:

networks:
  scholio-network:
    name: scholio-network
