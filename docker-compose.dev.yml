services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-scholio}
      APP_DB_USER: ${APP_DB_USER:-scholio_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-scholio_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholio}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_dev_data:/data

  typst:
    build:
      context: ./typst-service
    restart: unless-stopped
    ports:
      - "3100:3100"

  embed:
    build:
      context: ./embed-service
    restart: unless-stopped
    ports:
      - "3200:3200"

  scipy:
    build:
      context: ./scipy-service
    restart: unless-stopped
    environment:
      SCIPY_API_KEY: ${SCIPY_API_KEY:-}
    ports:
      - "3400:3400"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${R2_BUCKET:-scholio-backups-dev}
      "
    restart: on-failure

  backup:
    build:
      context: .
      dockerfile: backup-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-scholio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-scholio}
      R2_BUCKET: ${R2_BUCKET:-scholio-backups-dev}
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_logs_dev:/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
    name: scholio_postgres_dev
  minio_dev_data:
    name: scholio_minio_dev
  redis_dev_data:
    name: scholio_redis_dev
  languagetool_ngrams:
    name: scholio_languagetool_ngrams
  backup_logs_dev:
    name: scholio_backup_logs_dev
