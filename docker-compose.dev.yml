services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-scholio}
      APP_DB_USER: ${APP_DB_USER:-scholio_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-scholio_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholio}"]
      interval: 5s
      timeout: 3s
      retries: 5

  typst:
    build:
      context: ./typst-service
    restart: unless-stopped
    ports:
      - "3100:3100"

  embed:
    build:
      context: ./embed-service
    restart: unless-stopped
    ports:
      - "3200:3200"

  #scipy:
  #  build:
  #    context: ./scipy-service
  #  restart: unless-stopped
  #  environment:
  #    SCIPY_API_KEY: ${SCIPY_API_KEY:-}
  #  ports:
  #    - "3400:3400"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    security_opt:
      - "no-new-privileges:true"
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=info
      #- RUSTFS_TLS_PATH=/opt/tls
      #- RUSTFS_OBS_ENDPOINT=http://otel-collector:4318
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/app/logs
      #- ./deploy/data/certs/:/opt/tls # TLS configuration, you should create tls directory and put your tls files in it and then specify the path here
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_dev_data:
    name: scholio_postgres_dev
  rustfs-data:
  rustfs-logs:
  redis_dev_data:
    name: scholio_redis_dev
