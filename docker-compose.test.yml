services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scholio
      POSTGRES_PASSWORD: scholio_test
      POSTGRES_DB: scholio_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scholio']
      interval: 5s
      timeout: 3s
      retries: 5
