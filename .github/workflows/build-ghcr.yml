  #   if: |
  #     always() &&
  #     needs.build-app.result == 'success' &&
  #     !contains(needs.*.result, 'failure') &&
  #     !contains(needs.*.result, 'cancelled')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: superfly/flyctl-actions/setup-flyctl@master
  #
