  #       run: |
  #         flyctl deploy --app ${{ vars.FLY_APP_SCHOLIO }} \
  #           --image ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }} \
  #           --strategy rolling \
  #           --yes
  #       env:
  #         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  #
  #     - name: Deploy typst (if rebuilt)
  #       if: needs.build-typst.result == 'success'
  #       run: |
  #         flyctl deploy --app ${{ vars.FLY_APP_TYPST }} \
  #           --config typst-service/fly.toml \
  #           --image ${{ env.REGISTRY }}/${{ github.repository_owner }}/scholio-typst:sha-${{ github.sha }} \
  #           --strategy rolling \
  #           --yes
  #       env:
  #         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  #
  #     - name: Notify Slack on successful deploy
  #       run: |
  #         curl --silent --show-error -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
  #           -H "Content-Type: application/json" \
  #           -d "{\"text\":\"✅ *Deployed to production* · \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver en GitHub Actions>\"}"

  notify-failure:
    needs: [build-app, build-typst]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on workflow failure
        run: |
          curl --silent --show-error -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🔴 *Build failed* · \`${{ github.repository }}\` · branch \`${{ github.ref_name }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver en GitHub Actions>\"}"
