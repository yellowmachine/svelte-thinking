name: Build Typst Service

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub
  push:
    paths:
      - "typst-service/**" # Solo se dispara si tocas ALGO dentro de esa carpeta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./typst-service
          push: true
          platforms: linux/amd64 # Asegura compatibilidad con tu Hetzner
          tags: ghcr.io/${{ github.repository_owner }}/scholio-typst:latest
