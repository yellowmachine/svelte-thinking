services:
  scholio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 20M
      # App
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Database (external, accessed by hostname)
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DB_USER: scholio_app
      # Internal services (scholio-network)
      REDIS_URL: ${REDIS_URL}
      EMBED_SERVICE_URL: ${EMBED_SERVICE_URL}
      TYPST_SERVICE_URL: ${TYPST_SERVICE_URL}
      # External services
      SCIPY_SERVICE_URL: ${SCIPY_SERVICE_URL}
      SCIPY_API_KEY: ${SCIPY_API_KEY}
      # Storage (S3-compatible, external)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      # Auth providers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI}
      ORCID_BASE_URL: ${ORCID_BASE_URL}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Encryption
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      # Public URLs (exposed to browser via dynamic env)
      PUBLIC_LIBRARIAN_URL: ${PUBLIC_LIBRARIAN_URL:-https://librarian.scholio.review}
      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - '3300:3000'
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scholio-network
      - dokploy-network

networks:
  scholio-network:
    external: true
  dokploy-network:
    external: true
