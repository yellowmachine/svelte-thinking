services:
  scholio:
    image: ghcr.io/yellowmachine/svelte-thinking:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 20M
      # App
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Database (external, accessed by hostname)
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DB_USER: scholio_app
      # Internal services (scholio-network)
      REDIS_URL: ${REDIS_URL}
      TYPST_SERVICE_URL: ${TYPST_SERVICE_URL}
      # Storage (S3-compatible, external)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      # Auth providers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI}
      ORCID_BASE_URL: ${ORCID_BASE_URL}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Encryption
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      # AI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_APP_KEY: ${OPENROUTER_APP_KEY}
      # Public URLs (exposed to browser via dynamic env)
      PUBLIC_LIBRARIAN_URL: ${PUBLIC_LIBRARIAN_URL:-https://librarian.scholio.review}
      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3300:3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scholio-network
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholio-network

  typst:
    image: ghcr.io/yellowmachine/scholio-typst:latest
    restart: unless-stopped
    networks:
      - scholio-network

  backup:
    build:
      context: .
      dockerfile: backup-service/Dockerfile
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # backup.sh sube por S3 API — apunta al rustfs de este stack, no a Cloudflare R2
      R2_BUCKET: ${R2_BUCKET:-scholio-backups}
      R2_ENDPOINT: ${R2_ENDPOINT:-http://rustfs:9000}
      R2_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_logs:/logs
    networks:
      - scholio-network

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - /rustfsdata:/data
      - rustfs_logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - scholio-network

volumes:
  redis_prod_data:
    name: scholio_redis_prod
  backup_logs:
    name: scholio_backup_logs
  rustfs_logs:
    name: scholio_rustfs_logs

networks:
  scholio-network:
    external: true
  dokploy-network:
    external: true
